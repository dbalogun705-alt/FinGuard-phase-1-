<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css folder/reset-password.css" />
    <title>FinGuard - Reset Password</title>
  </head>
  <body>
   

        
    <div class="reset-page">

        <div class="reset-card">

            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-icon">
                <img src="../Images/Logo.svg" alt="FinGuard logo">
                </div>

                <div class="logo-text">
            
                </div>
            </div>


            <!-- Heading -->
            <h1>Reset your password</h1>

            <p class="description">
                Enter the email associated with your account.<br>
                We'll send you a secure password reset link.
            </p>


            <!-- Form -->
            <form id="resetForm">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email address
                    </label>

                    <div class="email-box">

                        <span class="email-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder=""
                        >

                    </div>

                    <small id="errorMessage"></small>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="btn reset-btn"
                    id="resetButton"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- Success message -->
            <div
                id="successMessage"
                class="success-message"
            >
                Reset link sent successfully!
            </div>

        </div>
    </div>
    </main>
    <!-- JavaScript -->
    <script src="reset-password.js"></script>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
  </body>
</html>
