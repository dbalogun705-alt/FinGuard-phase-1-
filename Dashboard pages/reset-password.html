<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css folder/reset-password.css" />
    <title>FinGuard - Reset Password</title>
  </head>
  <body>
   

        
    <div class="reset-page">

        <div class="reset-card">

            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-icon">
                <img src="../Images/Logo.svg" alt="FinGuard logo">
                </div>

                <div class="logo-text">
            
                </div>
            </div>


            <!-- Heading -->
            <h1>Reset your password</h1>

            <p class="description" id="stepDescription">
                Enter the email associated with your account.<br>
                We'll send you a one-time code to reset it.
            </p>

            <div id="resetAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>
            <div id="otpHint" class="small text-primary mb-2 d-none"></div>

            <!-- Step 1: request the OTP -->
            <form id="resetForm">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email address
                    </label>

                    <div class="email-box">

                        <span class="email-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder=""
                            required
                        >

                    </div>

                    <small id="errorMessage"></small>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="btn reset-btn"
                    id="resetButton"
                >
                    Send Reset Code
                </button>

            </form>

            <!-- Step 2: enter the OTP + new password -->
            <form id="newPasswordForm" class="d-none">

                <div class="mb-3">
                    <label for="otp" class="form-label">6-digit code</label>
                    <input type="text" inputmode="numeric" maxlength="6" id="otp" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">New password</label>
                    <input type="password" id="newPassword" class="form-control" minlength="12" required>
                    <small class="text-muted">At least 12 characters.</small>
                </div>

                <button type="submit" class="btn reset-btn" id="confirmResetButton">
                    Reset Password
                </button>

            </form>


            <!-- Success message -->
            <div
                id="successMessage"
                class="success-message"
            >
                Your password has been reset. <a href="signin.html">Sign in</a>.
            </div>

        </div>
    </div>
    <!-- JavaScript -->
    <script src="../javascript/api.js"></script>
    <script src="../javascript/reset-password.js"></script>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
  </body>
</html>
