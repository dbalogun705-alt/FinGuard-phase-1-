<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinGuard - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css folder/auth-styles.css" rel="stylesheet">
</head>
<body>
 <div class="auth-screen">

  <!-- Logo Header -->
  <a href="../index.html" class="auth-logo">
    <img src="../Images/Logo.svg" alt="FinGuard logo" /> FinGuard
  </a>

  <!-- Sign In Card -->
  <div class="card auth-card">
    <div class="auth-header-bar"></div>

    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold m-0 text-dark">Sign In</h5>
        <div class="form-check form-switch d-flex align-items-center gap-2 m-0 p-0">
          <label class="form-check-label small text-muted" for="staySignedIn">Stay Signed In</label>
          <input class="form-check-input ms-0" type="checkbox" id="staySignedIn" checked>
        </div>
      </div>

      <!-- Social Login Buttons -->
      <div class="vstack gap-2 mb-3">
        <button type="button" class="btn btn-social" disabled>
          <i class="bi bi-apple fs-5"></i> Continue with Apple
        </button>
        <button type="button" class="btn btn-social" disabled>
          <i class="bi bi-google text-danger fs-5"></i> Continue with Google
        </button>
      </div>

      <div class="divider-text">
        <span>Or</span>
      </div>

      <!-- Form Inputs -->
      <form id="signinForm" novalidate>
        <div class="alert alert-danger py-2 small d-none" id="authAlert" role="alert"></div>

        <div class="mb-3">
          <label class="form-label small text-muted fw-medium" for="email">Email</label>
          <div class="form-control-icon">
            <i class="bi bi-envelope icon-left"></i>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label small text-muted fw-medium" for="password">Password</label>
            <a href="#" class="small text-decoration-none link-blue">Forgot Password?</a>
          </div>
          <div class="form-control-icon">
            <i class="bi bi-key icon-left"></i>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
            <i class="bi bi-eye-slash icon-right" data-toggle-password></i>
          </div>
        </div>

        <button type="submit" class="btn btn-finguard w-100 py-2 fs-6 mb-3" id="submitBtn">Sign In</button>
      </form>

      <div class="text-center">
        <span class="small text-muted">New to FinGuard? </span>
        <a href="signup.html" class="small text-decoration-none fw-semibold link-blue">Sign Up</a>
      </div>
    </div>
  </div>

 </div>

  <script src="../javascript/api.js"></script>
  <script src="../javascript/auth.js"></script>
</body>
</html>
