    <main class="dashboard-main">
         <main class="dti-page">

        <!-- HEADER -->
        <header class="dti-header">

            <h1>Debt Burden &amp; DTI</h1>

            <div class="dti-profile">
                <i class="bi bi-person-fill"></i>
            </div>

        </header>


        <!-- DTI SECTION -->
        <section class="dti-summary">

            <!-- CIRCLE -->
            <div class="dti-chart-area">

                <h2>DTI Ratio</h2>

                <div class="dti-chart">

                    <!--
                        The ring itself.
                        Green is the main section.
                        Red starts from the right side
                        and continues to the lower-right.
                    -->
                    <div class="dti-ring">

                        <div class="dti-ring-center">

                            <strong id="dtiRatio">
                                0.75
                            </strong>

                            <span>
                                Moderate
                            </span>

                        </div>

                    </div>

                </div>

            </div>


            <!-- EXPLANATION -->
            <div class="dti-explanation">

                <h3 id="dtiRatioLarge">
                    0.75
                </h3>

                <h4>
                    Moderate
                </h4>

                <p>
                    Your debt level is within
                    manageable range
                </p>

            </div>

        </section>


        <!-- INFORMATION BARS -->
        <section class="dti-information">

            <!-- Debt -->
            <button
                class="dti-info-row dti-debt-row"
                id="dtiDebtRow"
            >

                <span>
                    Total Monthly Debt
                </span>

                <strong>
                    ₦310,000
                </strong>

            </button>


            <!-- Income -->
            <button
                class="dti-info-row dti-income-row"
                id="dtiIncomeRow"
            >

                <span>
                    Monthly Income
                </span>

                <strong>
                    ₦1,250,000
                </strong>

            </button>


            <!-- Ratio -->
            <button
                class="dti-info-row dti-ratio-row"
                id="dtiRatioRow"
            >

                <span>
                    DTI Ratio
                </span>

                <strong>
                    0.75
                </strong>

            </button>


            <!-- Risk -->
            <button
                class="dti-info-row dti-risk-row"
                id="dtiRiskRow"
            >

                <span>
                    Risk Band
                </span>

                <strong>
                    Moderate
                </strong>

            </button>

        </section>

    </main>
    </main>
    <script src="Debt and DTI.js"></script>
    <script src="../javascript/api.js"></script>
  <script src="../javascript/dashboard.js"></script>
