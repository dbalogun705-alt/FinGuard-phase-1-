<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css folder/report.css" />
    <title>FinGuard Reports</title>
  </head>
  <body>
    <iframe src="sidebar.html" title="FinGuard sidebar" class="sidebar-frame">
    </iframe>

    <main class="page-content">
      <!--PAGE HEADER-->
      <div
        class="page-header container d-flex align-items-center fw-bold font-Roboto"
      >
        <h1 class="pt-4 px-4 mb-0 pb-2" id="header-text">Reports</h1>
        <span class="image ms-auto pb-2 pt-4 pe-3">
          <img src="../Images/report image.svg" alt="Report" />
        </span>
      </div>
      <div>
        <p class="pt-3 mx-2 px-4 fw-bold">
          Download and share your financial insights
        </p>

        <div class="reports-list">
          <a href="#" class="report-card d-flex align-items-center">
            <img src="../Images/FilePlus.svg" alt="" class="report-icon" />
            <span class="report-title">
              Financial Health summary
              <small>PDF</small>
            </span>
            <img
              src="../Images/ix_chevron-down-bar-small.svg"
              alt="Download report"
              class="download-icon"
            />
          </a>

          <a href="#" class="report-card d-flex align-items-center">
            <img src="../Images/CalendarPlus.svg" alt="" class="report-icon" />
            <span class="report-title">
              Cashflow Report
              <small>PDF</small>
            </span>
            <img
              src="../Images/ix_chevron-down-bar-small.svg"
              alt="Download report"
              class="download-icon"
            />
          </a>

          <a href="#" class="report-card d-flex align-items-center">
            <img src="../Images/ChartBar.svg" alt="" class="report-icon" />
            <span class="report-title">
              Debt &amp; DTI Reports
              <small>PDF</small>
            </span>
            <img
              src="../Images/ix_chevron-down-bar-small.svg"
              alt="Download report"
              class="download-icon"
            />
          </a>

          <a href="#" class="report-card d-flex align-items-center">
            <img src="../Images/CalendarDots.svg" alt="" class="report-icon" />
            <span class="report-title">
              Shortfall Forecast Report
              <small>PDF</small>
            </span>
            <img
              src="../Images/ix_chevron-down-bar-small.svg"
              alt="Download report"
              class="download-icon"
            />
          </a>
        </div>

        <!--BUTTON-->
        <div class="reports-list privacy-list mt-4">
          <a
            href="#"
            class="report-card1 d-flex align-items-center justify-content-center gap-2"
          >
            <img src="../Images/Vector-3.svg" alt="" class="privacy-icon" />
            <span class="report-title1 fw-semibold">
              Reports are private and secure
            </span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
