<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css folder/profile and settings.css" />
    <title>FinGuard - Profile & Settings</title>
  </head>
  <body>
    <iframe src="sidebar.html" title="FinGuard sidebar" class="sidebar-frame"></iframe>
     <main class="page-content">
       <main class="settings-page">

        <!-- HEADER -->
        <header class="settings-header">

            <div>
                <h1>Settings</h1>
                <p>Manage your preferences and accounts</p>
            </div>

            <!-- Profile picture -->
            <div class="profile-picture">
                <i class="bi bi-person-fill"></i>
            </div>

        </header>


        <!-- SETTINGS LIST -->
        <section class="settings-list">

            <!-- Product Information -->
            <button class="setting-row"
                    data-setting="Product Information">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Product Information
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Notification Preferences -->
            <button class="setting-row"
                    data-setting="Notification preferences">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Notification preferences
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Data & Privacy -->
            <button class="setting-row"
                    data-setting="Data & Privacy">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Data & Privacy
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Security -->
            <button class="setting-row"
                    data-setting="Security">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Security
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Connected Accounts -->
            <button class="setting-row"
                    data-setting="Connected Accounts">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Connected Accounts
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Dark Mode -->
            <div class="setting-row dark-mode-row">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Dark Mode
                </span>

                <label class="switch">

                    <input type="checkbox" id="darkMode">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Log out -->
            <button class="setting-row logout-row"
                    id="logoutButton">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Log out
                </span>

            </button>

        </section>

    </main>
</main>

    <script src="../javascript/profile and settings.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
