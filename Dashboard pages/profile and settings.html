</head>
<body>

      </div>
      <ul class="sidebar-nav">
        <li><a class="sidebar-link" href="../index.html"><img src="../Images/home icon.svg" alt="" /><span>Home</span></a></li>

        <li><a class="sidebar-link" href="Debt and DTI.html"><img src="../Images/computing.svg" alt="" /><span>Debt &amp; DTI</span></a></li>

        <li><a class="sidebar-link" href="Shortfall.html"><img src="../Images/align-bottom.svg" alt="" /><span>Shortfall Forecast</span></a></li>

      </ul>
      <div class="sidebar-footer">
        <a class="sidebar-link" href="signin.html"><img src="../Images/Logout.svg" alt="" /><span>Log out</span></a>
      </div>
    </aside>
        <main class="dashboard-main">
       <main class="settings-page">

        <!-- HEADER -->
        <header class="settings-header">

            <div>
                <h1>Settings</h1>
                <p>Manage your preferences and accounts</p>
            </div>

            <!-- Profile picture -->
            <div class="profile-picture">
                <i class="bi bi-person-fill"></i>
            </div>

        </header>


        <!-- SETTINGS LIST -->
        <section class="settings-list">

            <!-- Product Information -->
            <button class="setting-row"
                    data-setting="Product Information">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Product Information
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Notification Preferences -->
            <button class="setting-row"
                    data-setting="Notification preferences">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Notification preferences
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Data & Privacy -->
            <button class="setting-row"
                    data-setting="Data & Privacy">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Data & Privacy
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Security -->
            <button class="setting-row"
                    data-setting="Security">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Security
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Connected Accounts -->
            <button class="setting-row"
                    data-setting="Connected Accounts">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Connected Accounts
                </span>

                <i class="bi bi-chevron-right setting-arrow"></i>

            </button>


            <!-- Dark Mode -->
            <div class="setting-row dark-mode-row">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Dark Mode
                </span>

                <label class="switch">

                    <input type="checkbox" id="darkMode">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Log out -->
            <button class="setting-row logout-row"
                    id="logoutButton">

                <span class="setting-name">
                    <span class="small-arrow">›</span>
                    Log out
                </span>

            </button>

        </section>

    </main>
</main>

 <script src="../javascript/api.js"></script>
  <script src="../javascript/dashboard.js"></script> 
    <script src="../javascript/profile and settings.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
